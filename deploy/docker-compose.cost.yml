services:
  afyaplus-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: afyaplus-week7:local
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      CACHE_MAX_ITEMS: ${CACHE_MAX_ITEMS:-1000}
      MAX_INPUT_CHARS: ${MAX_INPUT_CHARS:-4000}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-180}
      COMPACT_OUTPUT_TOKENS: ${COMPACT_OUTPUT_TOKENS:-80}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-5}
    labels:
      com.example.service: "afyaplus-triage"
      com.example.environment: "capstone"
      com.example.owner: "week7-student"
      com.example.cost-center: "ai-platform"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
